name: Stale issues & PRs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 7
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,critical,roadmap,good first issue"
          exempt-pr-labels: "pinned,security,critical"
          stale-issue-message: |
            This issue has been inactive for 60 days. It will be closed in 7 days if no further activity occurs.
            If still relevant, please leave a comment.
          stale-pr-message: |
            This PR has been inactive for 30 days. It will be closed in 14 days if no further activity occurs.
          close-issue-message: "Closing as stale. Reopen if still relevant."
          close-pr-message: "Closing as stale. Reopen if still relevant."
