name: 🐛 Bug report
description: Something looks broken or behaves unexpectedly.
title: "bug: <short summary>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the details below.
  - type: checkboxes
    id: prereq
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and discussions and didn't find a duplicate.
          required: true
        - label: I'm on the latest deployed version (or `master` branch).
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Home / Hero
        - About
        - Work / Projects
        - Experience
        - Skills
        - Competitive Programming
        - Contact form
        - Lab / Concepts
        - Feeds
        - Navigation / Header / Footer
        - Theming / Dark-mode
        - Accessibility
        - Performance
        - Build / Tooling / CI
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear and concise description of the bug.
      placeholder: "When I click X on the contact form, …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: "I expected …"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe '...'
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL where it happens
      placeholder: "https://ayushyadav.dev/contact"
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: "Chrome 126 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, console output
      description: Drag-drop images or paste error output.
