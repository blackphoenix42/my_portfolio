name: 📚 Documentation
description: Report missing, unclear, or incorrect documentation.
title: "docs: <short summary>"
labels: ["documentation", "triage"]
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      placeholder: "README.md / docs/CONTRIBUTING.md / /about"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What's wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
